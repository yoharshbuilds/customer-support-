services:
  - type: web
    name: resolve-dashboard
    runtime: python
    plan: free
    region: singapore          # closest to Bangalore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Every secret is set in the Render dashboard, never committed.
      - key: DATABASE_URL          # Supabase SESSION POOLER string
        sync: false
      - key: FRESHCHAT_API_BASE
        sync: false
      - key: FRESHCHAT_API_TOKEN
        sync: false
      - key: FRESHCHAT_PUBLIC_KEY  # from Freshchat webhook settings
        sync: false
      - key: WEBHOOK_SECRET        # extra ?secret=... guard on the URL
        sync: false
      - key: METABASE_URL
        sync: false
      - key: METABASE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CUSTOMER_HASH_SALT    # must match what is already in .env
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
